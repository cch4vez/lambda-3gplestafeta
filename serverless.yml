# service: intlog-3pl-estafeta-bolpis
service: intlog-3GplEstafeta
useDotenv: true

provider:
  name: aws
  runtime: nodejs16.x
  stage: prod
  profile: 'axo_2025'
  region: 'us-east-1'
  environment:
    DB_HOST: axo-inlog-prod-db.clw2k6go2ytb.us-east-1.rds.amazonaws.com
    DB_PORT: 5432
    DB_NAME: GOBIERNO_CENTRAL_INTEGRADOR
    DB_USER: usrintlog
    DB_PASSWORD: M0u#kBE6E5acp
  vpc:
    securityGroupIds:
      - sg-0002ae84e68052d98 
    subnetIds:
      - subnet-007e2686210d3098b
      - subnet-078a14c598aaabe46
      - subnet-011936c5ed057a6ba

  iam:
    role: arn:aws:iam::203918861826:role/intlog-prod-lambda-vpc-role
  deploymentBucket:
    name: intlog-prd-lambdasbucket
    serverSideEncryption: AES256

functions:
  3plEstafeta:
    handler: src/3gplestafeta.handler
    # handler: src/3gplestafeta_bolpis.handler
    timeout: 30
    url: true
    events:
      # - httpApi: POST /3gplestafeta
      - http:
          path: 3gplestafeta
          method: post

custom:
  esbuild:
    bundle: true
    minify: true

plugins:
  - serverless-esbuild
  - serverless-offline
  - serverless-prune-plugin
